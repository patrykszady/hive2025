# noVNC proxy for the EWCCV server browser (EwccvRemoteBrowserService,
# websockify on localhost:6096), embedded by /ewccv/browser like the Menards
# one (scripts/nginx-menards-vnc.conf): nginx exposes it at /ewccv-vnc/,
# gated by a Laravel auth_request (the ewccv-browser gate); guests get a 403.
#
# Goes in the hive.contractors server{} block next to the Menards locations.

location /ewccv-vnc/ {
    auth_request /ewccv-vnc-auth;

    proxy_pass http://127.0.0.1:6096/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /ewccv-vnc-auth {
    internal;

    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI /ewccv-vnc-auth;
    fastcgi_param REQUEST_METHOD GET;

    # auth_request subrequests must not forward a body.
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
}

# noVNC proxy for the server-side Menards receipt browser.
#
# Lets /menards/browser (Livewire page) embed the noVNC viewer without an SSH
# tunnel: websockify serves noVNC on localhost:6098 (MenardsRemoteBrowserService
# WS_PORT); nginx exposes it at /menards-vnc/ gated by a Laravel auth_request —
# only a signed-in user who passes Bank::viewAny (the same gate as the sidebar
# alert) gets through. Guests get a plain 403, never a redirect.
#
# INSTALL (Forge server, hive.contractors):
#   1. Paste both location blocks into the site's server{} block:
#      /etc/nginx/sites-available/hive.contractors
#      (via Forge UI: Site → Edit Nginx Configuration; put them next to the
#      existing `location /` block.)
#   2. nginx -t && service nginx reload
#
# The fastcgi socket path matches this server (php8.3-fpm). $realpath_root is
# the site's public/ directory, same as the main PHP location block uses.

location /menards-vnc/ {
    auth_request /menards-vnc-auth;

    proxy_pass http://127.0.0.1:6098/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # VNC sessions are long-lived; do not let the proxy hang up mid-click.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /menards-vnc-auth {
    internal;

    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI /menards-vnc-auth;
    fastcgi_param REQUEST_METHOD GET;

    # auth_request subrequests must not forward a body.
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
}

# ─────────────────────────────────────────────────────────────────────────────
# TLS session resumption for hive.contractors  (mitigation for Cloudflare 525s)
#
# WHY: The origin currently has NO ssl_session_cache / ssl_session_tickets, so
#      every Cloudflare-edge -> origin connection performs a FULL TLS handshake.
#      Full handshakes exchange more packets; on a lossy edge->origin path a
#      single dropped ClientHello/ServerHello becomes a Cloudflare 525.
#      Enabling session resumption lets the edge reuse TLS sessions, drastically
#      cutting the number of full handshakes (and thus 525 exposure).
#
# IMPACT: Safe, additive. No behavior change for clients. No cert change.
#         Requires `nginx -t` then `systemctl reload nginx` (needs sudo).
#
# HOW TO APPLY (Forge-managed box) — pick ONE:
#
#   Option A (recommended, survives Forge re-deploys):
#     Put these directives in the site's server-include directory so Forge keeps
#     them. On the droplet:
#       /etc/nginx/forge-conf/hive.contractors/server/ssl-session.conf
#     (the site config already does: include forge-conf/hive.contractors/server/*;)
#     Then:  sudo nginx -t && sudo systemctl reload nginx
#
#   Option B (Forge UI):
#     Sites -> hive.contractors -> Files -> Edit Nginx Configuration, paste the
#     directives inside the `server { ... }` block that has `listen 443 ssl;`,
#     save (Forge validates + reloads automatically).
#
#   Option C (http-level, shared across all sites on the box):
#     Add the same directives to the http{} block in /etc/nginx/nginx.conf.
#
# Directives:

ssl_session_cache   shared:SSL:10m;   # ~40,000 sessions; shared across workers
ssl_session_timeout 1d;               # how long a resumable session stays valid
ssl_session_tickets on;               # stateless resumption (Cloudflare uses it)

# Optional, also cheap and helpful for an edge that keeps connections warm:
# keepalive_timeout   75s;
# keepalive_requests  1000;

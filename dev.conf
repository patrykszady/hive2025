# Settings for the shared launcher (~/web/start-dev.sh). Port comes from APP_URL.
APP_LABEL="Hive (hive.contractors)"
APP_HOST="0.0.0.0"   # reachable from the phone on the LAN and from the tunnel

# dev.hive.contractors tunnel. The credentials path is passed explicitly
# because the committed YAML cannot be right on every machine.
CLOUDFLARED_CONFIG="$PWD/cloudflared-config.yml"
CLOUDFLARED_CREDENTIALS="$HOME/.cloudflared/${CLOUDFLARE_TUNNEL_ID:-2f84efc0-98d3-42b6-8ddf-c53d0bb0ce27}.json"

# Horizon (queues) and Reverb (websockets) are part of running this app.
# One master process each: without the guard every run stacked another
# Horizon on top of the last and jobs were picked up by several workers.
AFTER_START() {
  if pgrep -f "artisan horizon --no-interaction" >/dev/null 2>&1; then
    echo "  ✅ horizon (pid $(pgrep -f 'artisan horizon --no-interaction' | head -n 1))"
  else
    setsid -f php artisan horizon --no-interaction >"$LOG_DIR/horizon.log" 2>&1 < /dev/null
    sleep 0.8
    pgrep -f "artisan horizon --no-interaction" >/dev/null 2>&1 && echo "  ✅ horizon started" || echo "  ❌ horizon failed → $LOG_DIR/horizon.log"
  fi
  if pgrep -f "artisan reverb:start" >/dev/null 2>&1; then
    echo "  ✅ reverb (pid $(pgrep -f 'artisan reverb:start' | head -n 1))"
  else
    setsid -f php artisan reverb:start --no-interaction >"$LOG_DIR/reverb.log" 2>&1 < /dev/null
    sleep 1
    pgrep -f "artisan reverb:start" >/dev/null 2>&1 && echo "  ✅ reverb started (:8080)" || echo "  ❌ reverb failed → $LOG_DIR/reverb.log"
  fi
  # Hookdeck webhook tunnels are optional: only when the CLI is installed.
  local hookdeck; hookdeck="$(command -v hookdeck 2>/dev/null)"
  [ -z "$hookdeck" ] && hookdeck=$(ls "$HOME"/.nvm/versions/node/*/bin/hookdeck 2>/dev/null | tail -n 1)
  if [ -n "$hookdeck" ] && ! pgrep -f "hookdeck listen" >/dev/null 2>&1; then
    "$hookdeck" connection upsert nylas-local --source-name nylas --source-type WEBHOOK --destination-name nylas-local-cli --destination-type CLI --destination-cli-path /webhooks/nylas >>"$LOG_DIR/hookdeck.log" 2>&1
    setsid -f "$hookdeck" listen 8000 nylas nylas-local --path /webhooks/nylas --output compact >>"$LOG_DIR/hookdeck.log" 2>&1 < /dev/null
    "$hookdeck" connection upsert mailtrap-local --source-name mailtrap --source-type WEBHOOK --destination-name mailtrap-local-cli --destination-type CLI --destination-cli-path / >>"$LOG_DIR/hookdeck.log" 2>&1
    setsid -f "$hookdeck" listen 8000 mailtrap mailtrap-local --path "/" --output compact >>"$LOG_DIR/hookdeck.log" 2>&1 < /dev/null
    "$hookdeck" connection upsert app-local --source-name http --source-type HTTP --source-allowed-methods GET,POST,PUT,PATCH,DELETE --destination-name app-local-cli --destination-type CLI --destination-cli-path /l >>"$LOG_DIR/hookdeck.log" 2>&1
    setsid -f "$hookdeck" listen 8000 http app-local --path "/l" --output compact >>"$LOG_DIR/hookdeck.log" 2>&1 < /dev/null
    echo "  ✅ hookdeck listeners started → $LOG_DIR/hookdeck.log"
  fi
}

STOP_EXTRAS() {
  pkill -f "artisan horizon --no-interaction" >/dev/null 2>&1
  pkill -f "artisan reverb:start" >/dev/null 2>&1
  pkill -f "hookdeck listen" >/dev/null 2>&1
  return 0
}

STATUS_EXTRAS() {
  pgrep -f "artisan horizon --no-interaction" >/dev/null 2>&1 && echo "       horizon running" || echo "       horizon not running"
  pgrep -f "artisan reverb:start" >/dev/null 2>&1 && echo "       reverb running" || echo "       reverb not running"
}

EXTRA_INFO() {
  echo "      public dev: https://dev.hive.contractors (tunnel)"
}
